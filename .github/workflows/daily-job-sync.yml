name: Daily Job Sync

on:
  schedule:
    # Todos los días a las 10:00 UTC (07:00 AM hora de Uruguay)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite dispararlo manualmente desde GitHub si se desea

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PostulaUY Job Sync
        run: |
          # Ejecuta 2 tandas consecutivas para asegurar que todas las fuentes se sincronicen dentro del límite de 60s de Vercel
          for i in 1 2; do
            echo "Ejecutando tanda $i..."
            curl -s -S -X POST "${{ secrets.APP_URL || 'https://postulauy.com' }}/api/cron/sync-jobs" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "User-Agent: vercel-cron/1.0" \
              -H "Content-Type: application/json"
            echo ""
            sleep 3
          done
